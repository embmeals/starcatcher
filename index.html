<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<title>Starcatcher</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#rotate {
	display: none;
	position: absolute;
	inset: 0;
	z-index: 10;
	align-items: center;
	justify-content: center;
	background: #0a0620;
	font: 600 22px system-ui, sans-serif;
	text-align: center;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate {
		display: flex;
	}
}

#status, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	top: 0;
	bottom: 0;
	background-color: #000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

/* The engine is a ~10MB download on a first visit. Without a number on screen
   a slow connection is indistinguishable from a broken page. */
#status-percent {
	position: absolute;
	bottom: calc(10% + 22px);
	left: 0;
	right: 0;
	text-align: center;
	color: #cfc6ff;
	font: 600 15px system-ui, sans-serif;
	letter-spacing: 0.08em;
}

#status-hint {
	position: absolute;
	bottom: calc(10% - 26px);
	left: 0;
	right: 0;
	text-align: center;
	color: #6d6590;
	font: 400 12px system-ui, sans-serif;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="rotate">Turn your phone sideways to play</div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-percent"></div>
			<progress id="status-progress"></progress>
			<div id="status-hint"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
// Filled in by the exporter. A hardcoded copy shipped stale fileSizes, so the
// progress total was ~770KB short and the bar sat at 100% before the load
// finished, and any export-preset change never reached the page.
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1139196,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusPercent = document.getElementById('status-percent');
	const statusHint = document.getElementById('status-hint');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		// 'hidden' is never refused. The stall notice sets initializing=false,
		// and a load that finished after the notice used to be locked out
		// here, leaving an opaque "reload the page" over a running game.
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		if (statusMode === mode || !initializing) {
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const loading = mode === 'progress';
		statusProgress.style.display = loading ? 'block' : 'none';
		statusPercent.style.display = loading ? 'block' : 'none';
		statusHint.style.display = loading ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (loading) {
			statusPercent.textContent = 'LOADING';
			// Only worth saying on the download that actually costs something.
			statusHint.textContent = 'First visit downloads the engine';
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// A stall detector, not a deadline: every byte of progress pushes the
		// notice out again, so a slow but moving download is never told to
		// reload, while a fetch that has truly died still gets the message.
		var stallTimer = null;
		function armStallTimer() {
			clearTimeout(stallTimer);
			stallTimer = setTimeout(function () {
				displayFailureNotice('The game is taking longer than expected to load. Check your connection and reload the page.');
			}, 45000);
		}
		armStallTimer();

		engine.startGame({
			'onProgress': function (current, total) {
				armStallTimer();
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusPercent.textContent = 'LOADING ' + Math.floor(current / total * 100) + '%';
				} else {
					// Some servers send no length, so the bar has to stay
					// indeterminate. Say so rather than showing a stuck 0%.
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusPercent.textContent = 'LOADING';
				}
			},
		}).then(() => {
			clearTimeout(stallTimer);
			// Give Godot a couple of frames to paint its title screen before
			// tearing down the black overlay, otherwise the canvas flashes.
			requestAnimationFrame(() => requestAnimationFrame(() => setStatusMode('hidden')));
		}, (err) => {
			clearTimeout(stallTimer);
			displayFailureNotice(err);
		});
	}
}());
		</script>
	</body>
</html>
